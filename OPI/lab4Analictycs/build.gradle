tasks.register("classCompile",JavaCompile){

	source = fileTree(project.property('srcDir'))
	            .include('**/*.java')
	            
	destinationDirectory = file(project.property('classDir'))
	
	classpath = configurations.compileClasspath
	options.encoding = 'UTF-8'
}




tasks.register("warBuild",Exec){
	dependsOn classCompile
	dependsOn npmRun

	doFirst{

		def staging = file("${project.property('buildDir')}/staging")
		
    	staging.mkdirs()
		mkdir "${staging}/META-INF"
		mkdir "${staging}/WEB-INF/classes" 
		def meta = file("${staging}/META-INF/MANIFEST.MF")
		meta.text = """Manifest-Version: 1.0
Implementation-Version: ${project.property('version')}
"""
		copy {
		    from project.property('classDir')
		    into "${staging}/WEB-INF/classes"
		}
		copy {
		    from 'src/main/resources'
		    include '**/*'
		    into "${staging}/WEB-INF/classes"
		}
		copy {
			from 'frontend/dist'
			from project.property('webAppDir')
			into staging
		}
	}

	workingDir = "${project.property('buildDir')}/staging"
	
	commandLine 'jar','cvfm'
	args "../${project.property('warName')}"
	args 'META-INF/MANIFEST.MF'
	args '.'

}



// LOCAL TASKS

tasks.register("dockerClean",Exec){
	commandLine 'docker-compose', 'down', '-v' , '--remove-orphans'
}

tasks.register("myClean",Delete){
	dependsOn dockerClean
	delete project.property('buildDir')
	
}

tasks.register("dockerUp",Exec){
		commandLine 'docker-compose', 'up', '-d', 'app-weblab', 'selenium-hub'
}

tasks.register("dockerTest",Exec){
		dependsOn dockerUp

		commandLine 'docker-compose', 'run', '--rm',
		        'test-runner',
		        'gradle',
		        '--project-cache-dir',
		        '/tmp/gradle-project',
		        'myTest'
}

tasks.register("localTest"){
	dependsOn dockerUp
	//link http://localhost:8081/webLab4/
	dependsOn myTest
}


tasks.register("report") {
    def iscommit = project.hasProperty('commit')
    def reportPath = "${project.property('buildDir')}/reports/tests/xml"
    
    doLast {
        ["git", "add", "${reportPath}/*.xml"].execute(null, project.projectDir).waitFor()
        
        if (iscommit) {
            def msg = project.findProperty('message') ?: "report XML"
            ["git", "commit", "-m", msg].execute(null, project.projectDir).waitFor()
        }
    }
}

// DOCKER TEST TASKS

tasks.register("myTest",Test){
    useJUnitPlatform()

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

	reports{
		junitXml.required = true
		html.required = true
	}
}

tasks.withType(Test){
	def baseOutputDir = file(project.property("outputTest"))
   	//output_report_path =  outputTest/test/xml (target)
    reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/html")
    reports.junitXml.outputLocation = layout.buildDirectory.dir("reports/tests/xml")

}
