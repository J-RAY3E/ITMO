plugins {
	id "java"
	id "io.gatling.gradle" version "3.13.0"
}


repositories{
	mavenCentral()
}

ext{
	reportsDir = file("$buildDir/reports/gatling")
}

dependencies {

	compileOnly 'javax:javaee-api:8.0'
    implementation 'javax.persistence:javax.persistence-api:2.2'

    testCompileOnly 'javax:javaee-api:8.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    
    testImplementation 'org.hibernate:hibernate-core:5.6.15.Final'
    testImplementation 'com.h2database:h2:2.2.224'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.20.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

	gatling 'io.gatling:gatling-app:3.13.0'
	gatling 'io.gatling.highcharts:gatling-charts-highcharts:3.13.0'
}

sourceSets {
	jmh {
		java { srcDir 'src/jmh/java' }
		compileClasspath += sourceSets.main.runtimeClasspath + files(project.property('classDir'))
		runtimeClasspath += sourceSets.main.runtimeClasspath + files(project.property('classDir'))
	}
}

dependencies {
	jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
	jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.register("jmh", JavaExec) {
	dependsOn 'compileJmhJava', 'classCompile'
	description = 'Run JMH benchmarks'
	group = 'benchmark'
	classpath = sourceSets.jmh.runtimeClasspath + sourceSets.jmh.compileClasspath
	mainClass = 'org.openjdk.jmh.Main'
	doFirst {
		mkdir "$buildDir/reports/jmh"
	}
	args '-rf', 'json'
	args '-rff', "$buildDir/reports/jmh/results.json"
}

compileJmhJava {
	dependsOn 'classCompile'
}

// DOCKER BUILDER LAB4

tasks.register("npmInstall",Exec){
	workingDir project.property('frontend')
	commandLine 'npm', 'install'
}

tasks.register("npmRun",Exec){
	workingDir project.property('frontend')
	dependsOn npmInstall
	commandLine 'npm', 'run','build'
}
